AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EC2 Dev Workstation - Ubuntu 22.04 ARM64 (Graviton) with XFCE4 desktop,
  XRDP, Node.js 20, Claude Code, AWS CLI v2, and VS Code.

# ── Parameters ────────────────────────────────────────────────────────────────

Parameters:

  NamePrefix:
    Type: String
    Default: dev-workstation
    Description: Prefix for all resource names

  InstanceType:
    Type: String
    Default: t4g.large
    Description: EC2 instance type (must be ARM/Graviton)
    AllowedValues:
      - t4g.medium
      - t4g.large
      - t4g.xlarge
      - t4g.2xlarge
      - m6g.large
      - m6g.xlarge
      - m6g.2xlarge

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the workstation into

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet ID (use a public subnet when CreateEip is true)

  AllowedCidrBlock:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to SSH and RDP into the workstation
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid IPv4 CIDR block (e.g. 203.0.113.0/24)

  SshPublicKeyMaterial:
    Type: String
    Description: SSH public key material (paste the contents of your id_rsa.pub)

  RdpPassword:
    Type: String
    Description: Password for the ubuntu user RDP session (min 8 characters)
    NoEcho: true
    MinLength: 8

  RootVolumeSizeGb:
    Type: Number
    Default: 50
    MinValue: 20
    MaxValue: 500
    Description: Root EBS volume size in GB

  CreateEip:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to allocate and attach an Elastic IP

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/arm64/hvm/ebs-gp2/ami-id
    Description: Ubuntu 22.04 ARM64 AMI (resolved from SSM Parameter Store)

# ── Conditions ────────────────────────────────────────────────────────────────

Conditions:
  ShouldCreateEip: !Equals [!Ref CreateEip, 'true']

# ── Resources ─────────────────────────────────────────────────────────────────

Resources:

  WorkstationKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${NamePrefix}-key'
      PublicKeyMaterial: !Ref SshPublicKeyMaterial

  WorkstationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${NamePrefix}-sg'
      GroupDescription: Dev workstation SSH and RDP access
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidrBlock
          Description: SSH
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref AllowedCidrBlock
          Description: RDP
      SecurityGroupEgress:
        - IpProtocol: '-1'
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-sg'
        - Key: Project
          Value: dev-workstation
        - Key: ManagedBy
          Value: cloudformation

  WorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: dev-workstation
        - Key: ManagedBy
          Value: cloudformation

  WorkstationInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${NamePrefix}-profile'
      Roles:
        - !Ref WorkstationRole

  WorkstationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref WorkstationKeyPair
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref WorkstationSecurityGroup
      IamInstanceProfile: !Ref WorkstationInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSizeGb
            DeleteOnTermination: true
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > /var/log/user-data.log 2>&1

            export DEBIAN_FRONTEND=noninteractive
            RDP_PASSWORD="${RdpPassword}"
            AWS_REGION="${AWS::Region}"

            # ── System update ─────────────────────────────────────────────────
            apt-get update -y
            apt-get upgrade -y

            # ── Desktop environment (XFCE4 + XRDP) ───────────────────────────
            apt-get install -y \
              xfce4 \
              xfce4-goodies \
              xrdp \
              dbus-x11 \
              x11-xserver-utils \
              xorgxrdp

            systemctl enable xrdp
            systemctl start xrdp

            # Allow ubuntu user to start a graphical session via xrdp
            echo "startxfce4" > /home/ubuntu/.xsession
            chown ubuntu:ubuntu /home/ubuntu/.xsession

            # Set the RDP password for ubuntu user
            echo "ubuntu:$RDP_PASSWORD" | chpasswd

            # Add xrdp user to ssl-cert group (required for TLS)
            usermod -aG ssl-cert xrdp
            systemctl restart xrdp

            # ── Node.js 20 LTS (arm64) ────────────────────────────────────────
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs

            # ── Claude Code ───────────────────────────────────────────────────
            npm install -g @anthropic-ai/claude-code

            # ── AWS CLI v2 (arm64) ────────────────────────────────────────────
            cd /tmp
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip
            apt-get install -y unzip
            unzip -q awscliv2.zip
            ./aws/install
            rm -rf awscliv2.zip aws/

            # ── VS Code (arm64 .deb) ──────────────────────────────────────────
            curl -fsSL "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-arm64" \
              -o /tmp/vscode.deb
            apt-get install -y /tmp/vscode.deb
            rm /tmp/vscode.deb

            # ── Useful dev tools ──────────────────────────────────────────────
            apt-get install -y \
              git \
              curl \
              wget \
              jq \
              vim \
              tmux \
              build-essential \
              python3-pip \
              ca-certificates \
              gnupg

            # ── Configure AWS region default ──────────────────────────────────
            sudo -u ubuntu bash -c "
              mkdir -p /home/ubuntu/.aws
              cat > /home/ubuntu/.aws/config <<AWS_CONFIG_EOF
            [default]
            region = $AWS_REGION
            output = json
            AWS_CONFIG_EOF
            "

            # ── Desktop shortcut: VS Code ─────────────────────────────────────
            sudo -u ubuntu bash -c "
              mkdir -p /home/ubuntu/Desktop
              cat > /home/ubuntu/Desktop/vscode.desktop <<VSCODE_DESKTOP_EOF
            [Desktop Entry]
            Name=Visual Studio Code
            Comment=Code Editing. Redefined.
            Exec=/usr/bin/code --no-sandbox %F
            Icon=vscode
            Type=Application
            Categories=Development;
            VSCODE_DESKTOP_EOF
              chmod +x /home/ubuntu/Desktop/vscode.desktop
            "

            # ── Final restart of xrdp ─────────────────────────────────────────
            systemctl restart xrdp

            echo "Bootstrap complete: $(date)"
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-workstation'
        - Key: Project
          Value: dev-workstation
        - Key: ManagedBy
          Value: cloudformation

  WorkstationEip:
    Type: AWS::EC2::EIP
    Condition: ShouldCreateEip
    Properties:
      InstanceId: !Ref WorkstationInstance
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-eip'
        - Key: Project
          Value: dev-workstation
        - Key: ManagedBy
          Value: cloudformation

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref WorkstationInstance

  PublicIp:
    Description: Public IP (EIP if enabled, else instance public IP)
    Value: !If
      - ShouldCreateEip
      - !Ref WorkstationEip
      - !GetAtt WorkstationInstance.PublicIp

  PrivateIp:
    Description: Private IP of the instance
    Value: !GetAtt WorkstationInstance.PrivateIp

  AmiId:
    Description: Ubuntu 22.04 ARM64 AMI used
    Value: !Ref AmiId

  SshCommand:
    Description: SSH command to connect
    Value: !If
      - ShouldCreateEip
      - !Sub 'ssh -i ~/.ssh/id_rsa ubuntu@${WorkstationEip}'
      - !Sub 'ssh -i ~/.ssh/id_rsa ubuntu@${WorkstationInstance.PublicIp}'

  RdpConnection:
    Description: RDP endpoint (host:port)
    Value: !If
      - ShouldCreateEip
      - !Sub '${WorkstationEip}:3389'
      - !Sub '${WorkstationInstance.PublicIp}:3389'

  KeyPairId:
    Description: Key pair resource ID
    Value: !Ref WorkstationKeyPair
