AWSTemplateFormatVersion: '2010-09-09'
Description: 'Medallion Architecture Demo - Bronze/Silver/Gold ETL pipeline with AWS Glue'

# ============================================================
# PARAMETERS
# ============================================================
Parameters:

  ProjectName:
    Type: String
    Default: medallion-demo
    Description: Prefix for all resource names

  BucketSuffix:
    Type: String
    Description: Globally unique suffix for the S3 bucket name (use your AWS account ID)

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  GlueVersion:
    Type: String
    Default: '4.0'
    Description: AWS Glue engine version

  WorkerType:
    Type: String
    Default: G.1X
    Description: Glue worker type (G.1X = 1 DPU per worker)

  NumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Number of Glue workers per job (2 = minimum; keeps each job at 2 DPU within the 4 DPU total limit)

  JobTimeoutMinutes:
    Type: Number
    Default: 60
    Description: Maximum job runtime in minutes

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR block

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/31

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/31

  PrivateSubnet3Cidr:
    Type: String
    Default: 10.0.12.0/31

# ============================================================
# PARAMETER GROUPING (Console UI)
# ============================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectName
          - BucketSuffix
          - Environment
      - Label:
          default: Glue Job Configuration
        Parameters:
          - GlueVersion
          - WorkerType
          - NumberOfWorkers
          - JobTimeoutMinutes
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidr
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
          - PrivateSubnet3Cidr
    ParameterLabels:
      BucketSuffix:
        default: S3 Bucket Suffix (must be globally unique)

# ============================================================
# RESOURCES
# ============================================================
Resources:

  # ----------------------------------------------------------
  # VPC
  # ----------------------------------------------------------

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ----------------------------------------------------------
  # PUBLIC SUBNETS (2) — for NAT gateway
  # ----------------------------------------------------------

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ----------------------------------------------------------
  # PRIVATE SUBNETS (3) — for Glue workers, one per AZ
  # ----------------------------------------------------------

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-3'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ----------------------------------------------------------
  # INTERNET GATEWAY
  # ----------------------------------------------------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ----------------------------------------------------------
  # NAT GATEWAY (single, in public subnet 1)
  # ----------------------------------------------------------

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ----------------------------------------------------------
  # ROUTE TABLES
  # ----------------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  # ----------------------------------------------------------
  # SECURITY GROUP — Glue workers require self-referencing rule
  # for internal worker-to-worker communication
  # ----------------------------------------------------------

  GlueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName} Glue workers'
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-glue-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Self-referencing ingress must be a separate resource to avoid circular dependency
  GlueSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref GlueSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref GlueSecurityGroup
      Description: Allow all traffic between Glue workers in the same security group

  # ----------------------------------------------------------
  # S3 VPC ENDPOINT (Gateway) — private subnets reach S3
  # without traversing the NAT gateway (no data transfer cost)
  # ----------------------------------------------------------

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ----------------------------------------------------------
  # S3 BUCKET — data lake with versioning, encryption, lifecycle
  # ----------------------------------------------------------

  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${BucketSuffix}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: bronze-to-standard-ia
            Status: Enabled
            Prefix: bronze/
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
          - Id: expire-spark-logs
            Status: Enabled
            Prefix: spark-logs/
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ----------------------------------------------------------
  # IAM ROLE & POLICY — scoped S3 access for Glue
  # ----------------------------------------------------------

  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-glue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      # Provides CloudWatch Logs, Glue Catalog, EC2 networking permissions
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  GlueS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-glue-s3-policy'
      Roles:
        - !Ref GlueServiceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BucketList
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt DataLakeBucket.Arn
          - Sid: ObjectReadWrite
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${DataLakeBucket.Arn}/*'

  # ----------------------------------------------------------
  # GLUE NETWORK CONNECTIONS — one per private subnet (AZ)
  # Bronze job uses all three to spread workers across AZs.
  # Silver and Gold each use a dedicated connection.
  # ----------------------------------------------------------

  GlueNetworkConnection1:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref AWS::AccountId
      ConnectionInput:
        Name: !Sub '${ProjectName}-network-connection-1'
        ConnectionType: NETWORK
        PhysicalConnectionRequirements:
          SubnetId: !Ref PrivateSubnet1
          SecurityGroupIdList:
            - !Ref GlueSecurityGroup
          AvailabilityZone: !Select [0, !GetAZs '']

  GlueNetworkConnection2:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref AWS::AccountId
      ConnectionInput:
        Name: !Sub '${ProjectName}-network-connection-2'
        ConnectionType: NETWORK
        PhysicalConnectionRequirements:
          SubnetId: !Ref PrivateSubnet2
          SecurityGroupIdList:
            - !Ref GlueSecurityGroup
          AvailabilityZone: !Select [1, !GetAZs '']

  GlueNetworkConnection3:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref AWS::AccountId
      ConnectionInput:
        Name: !Sub '${ProjectName}-network-connection-3'
        ConnectionType: NETWORK
        PhysicalConnectionRequirements:
          SubnetId: !Ref PrivateSubnet3
          SecurityGroupIdList:
            - !Ref GlueSecurityGroup
          AvailabilityZone: !Select [2, !GetAZs '']

  # ----------------------------------------------------------
  # GLUE JOBS
  # ----------------------------------------------------------

  BronzeIngestionJob:
    Type: AWS::Glue::Job
    DependsOn:
      - GlueS3Policy
      - GlueNetworkConnection1
      - GlueNetworkConnection2
      - GlueNetworkConnection3
    Properties:
      Name: !Sub '${ProjectName}-bronze-ingestion'
      Role: !GetAtt GlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataLakeBucket}/scripts/bronze_ingestion.py'
        PythonVersion: '3'
      GlueVersion: !Ref GlueVersion
      WorkerType: !Ref WorkerType
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: !Ref JobTimeoutMinutes
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Connections:
        Connections:
          - !Ref GlueNetworkConnection1
          - !Ref GlueNetworkConnection2
          - !Ref GlueNetworkConnection3
      DefaultArguments:
        '--job-language': python
        '--job-bookmark-option': job-bookmark-disable
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${DataLakeBucket}/spark-logs/'
        '--S3_BUCKET': !Ref DataLakeBucket
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  SilverTransformationJob:
    Type: AWS::Glue::Job
    DependsOn:
      - GlueS3Policy
      - GlueNetworkConnection2
    Properties:
      Name: !Sub '${ProjectName}-silver-transformation'
      Role: !GetAtt GlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataLakeBucket}/scripts/silver_transformation.py'
        PythonVersion: '3'
      GlueVersion: !Ref GlueVersion
      WorkerType: !Ref WorkerType
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: !Ref JobTimeoutMinutes
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Connections:
        Connections:
          - !Ref GlueNetworkConnection2
      DefaultArguments:
        '--job-language': python
        '--job-bookmark-option': job-bookmark-disable
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${DataLakeBucket}/spark-logs/'
        '--S3_BUCKET': !Ref DataLakeBucket
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  GoldAggregationJob:
    Type: AWS::Glue::Job
    DependsOn:
      - GlueS3Policy
      - GlueNetworkConnection3
    Properties:
      Name: !Sub '${ProjectName}-gold-aggregation'
      Role: !GetAtt GlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataLakeBucket}/scripts/gold_aggregation.py'
        PythonVersion: '3'
      GlueVersion: !Ref GlueVersion
      WorkerType: !Ref WorkerType
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: !Ref JobTimeoutMinutes
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Connections:
        Connections:
          - !Ref GlueNetworkConnection3
      DefaultArguments:
        '--job-language': python
        '--job-bookmark-option': job-bookmark-disable
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${DataLakeBucket}/spark-logs/'
        '--S3_BUCKET': !Ref DataLakeBucket
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  # ----------------------------------------------------------
  # GLUE WORKFLOW & TRIGGERS
  # Pipeline: ON_DEMAND → Bronze → [SUCCEEDED] → Silver → [SUCCEEDED] → Gold
  # ----------------------------------------------------------

  MedallionWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: !Sub '${ProjectName}-workflow'
      Description: 'Medallion ETL pipeline: Bronze ingestion -> Silver cleanse -> Gold aggregation'
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  BronzeTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${ProjectName}-trigger-bronze'
      Type: ON_DEMAND
      WorkflowName: !Ref MedallionWorkflow
      Actions:
        - JobName: !Ref BronzeIngestionJob
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  SilverTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${ProjectName}-trigger-silver'
      Type: CONDITIONAL
      WorkflowName: !Ref MedallionWorkflow
      StartOnCreation: true
      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref BronzeIngestionJob
            State: SUCCEEDED
      Actions:
        - JobName: !Ref SilverTransformationJob
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  GoldTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub '${ProjectName}-trigger-gold'
      Type: CONDITIONAL
      WorkflowName: !Ref MedallionWorkflow
      StartOnCreation: true
      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref SilverTransformationJob
            State: SUCCEEDED
      Actions:
        - JobName: !Ref GoldAggregationJob
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

# ============================================================
# OUTPUTS
# ============================================================
Outputs:

  S3BucketName:
    Description: S3 data lake bucket name
    Value: !Ref DataLakeBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  S3BucketArn:
    Description: S3 data lake bucket ARN
    Value: !GetAtt DataLakeBucket.Arn

  GlueRoleArn:
    Description: IAM role ARN assumed by Glue jobs
    Value: !GetAtt GlueServiceRole.Arn

  BronzeJobName:
    Description: Bronze ingestion Glue job name
    Value: !Ref BronzeIngestionJob

  SilverJobName:
    Description: Silver transformation Glue job name
    Value: !Ref SilverTransformationJob

  GoldJobName:
    Description: Gold aggregation Glue job name
    Value: !Ref GoldAggregationJob

  WorkflowName:
    Description: Glue workflow name
    Value: !Ref MedallionWorkflow

  VpcId:
    Description: VPC ID
    Value: !Ref VPC

  PublicSubnetIds:
    Description: Public subnet IDs (comma-separated)
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]

  PrivateSubnetIds:
    Description: Private subnet IDs (comma-separated)
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]

  GlueSecurityGroupId:
    Description: Security group ID for Glue workers
    Value: !Ref GlueSecurityGroup

  GlueConnectionNames:
    Description: Glue network connection names (comma-separated)
    Value: !Join
      - ','
      - - !Ref GlueNetworkConnection1
        - !Ref GlueNetworkConnection2
        - !Ref GlueNetworkConnection3

  NatGatewayPublicIp:
    Description: Public IP of NAT gateway
    Value: !Ref NATGatewayEIP

  BronzeLayerPath:
    Description: S3 path for the bronze (raw) layer
    Value: !Sub 's3://${DataLakeBucket}/bronze/'

  SilverLayerPath:
    Description: S3 path for the silver (cleansed) layer
    Value: !Sub 's3://${DataLakeBucket}/silver/'

  GoldLayerPath:
    Description: S3 path for the gold (aggregated) layer
    Value: !Sub 's3://${DataLakeBucket}/gold/'

  ScriptsPath:
    Description: S3 path where Glue scripts are stored
    Value: !Sub 's3://${DataLakeBucket}/scripts/'

  RunWorkflowCommand:
    Description: AWS CLI command to start the medallion pipeline
    Value: !Sub 'aws glue start-workflow-run --name ${MedallionWorkflow} --region ${AWS::Region}'
